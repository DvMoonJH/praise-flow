<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1220">
<title>Praise Flow Beta 1</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#152033;--muted:#7a8494;--line:#e7e9ee;
  --blue:#2867e8;--blue2:#eaf1ff;--red:#c43c43;--amber:#b57a00;--amberBg:#fff2c7;
  --night:#0b1220;--night2:#151f32;--night3:#22304a;--green:#41c477;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100vh;max-width:760px;margin:auto;padding:18px 15px 112px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{font-size:29px;font-weight:950;letter-spacing:-1.2px}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:750;letter-spacing:0;margin-top:2px}
.btn{min-height:44px;padding:10px 14px;border-radius:14px;background:#e9edf3;color:#2d3b50;font-weight:850}
.btn.primary{background:var(--blue);color:white}
.btn.dark{background:#172237;color:white}
.btn.soft{background:#f1f3f6}
.btn.danger{background:#fde5e7;color:#9d2932}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 8px 26px rgba(20,32,50,.05)}
.setCard{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setCard h3{margin:0;font-size:19px;letter-spacing:-.4px}
.meta{font-size:13px;color:var(--muted);margin-top:5px}
.label{font-size:12px;font-weight:850;color:#667287;margin:13px 0 7px}
.input{width:100%;min-height:46px;border:1px solid #d9dde5;border-radius:14px;padding:12px 13px;background:#fff;color:var(--text);outline:none}
.input:focus{border-color:#91aff2;box-shadow:0 0 0 3px #eaf1ff}
.song{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}
.songHead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.songTools{display:flex;gap:6px}
.iconBtn{min-width:42px;height:42px;border-radius:12px;background:#f0f2f5;color:#475369;font-weight:900}
.quick{display:flex;flex-wrap:wrap;gap:7px}
.quick button{padding:8px 11px;border-radius:999px;border:1px solid #d8dde6;background:#fafbfc;color:#344259;font-weight:850}
.quick button.cue{background:#fff7dc;border-color:#ecd07d;color:#795600}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0 4px}
.step{display:flex;align-items:center;gap:5px;background:var(--blue2);color:#28508f;border-radius:12px;padding:8px 9px;font-weight:850}
.step.cue{background:var(--amberBg);color:#745000}
.step .mini{width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.65);color:inherit;padding:0;font-weight:950}
.customRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}
.bottomBar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid #dfe3e8;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}
.bottomInner{max-width:760px;margin:auto;display:flex;gap:9px}
.bottomInner .btn{flex:1}
.tip{background:#eef3fd;border-radius:16px;padding:11px 13px;font-size:12px;color:#4c6387;line-height:1.5;margin:12px 0}

/* run mode */
#run{position:fixed;inset:0;z-index:100;background:var(--night);color:white;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.runTop{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 18px 10px;z-index:4}
.runTopLine{display:flex;justify-content:space-between;align-items:center;gap:10px}
.runSet{font-size:13px;font-weight:850;color:#9aa9c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runCount{font-size:12px;color:#72819a}
.progress{height:5px;border-radius:99px;background:#243048;overflow:hidden;margin-top:12px}
.progress div{height:100%;background:#6aa4ff;transition:width .2s}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:74px 14px 112px;text-align:center}
.runSong{font-size:clamp(24px,7vw,38px);font-weight:900;color:#b0bed3;margin-bottom:10px;max-width:94vw;word-break:keep-all}
.kicker{font-size:16px;font-weight:900;letter-spacing:.12em;color:#71829d}
.current{font-size:clamp(180px,50vw,390px);font-weight:950;letter-spacing:-8px;line-height:.82;margin:2vh 0 3vh;word-break:keep-all;max-width:98vw;min-height:34vh;display:flex;align-items:center;justify-content:center;transition:color .18s,text-shadow .18s}
.note{min-height:48px;display:flex;align-items:center;justify-content:center}
.notePill{padding:12px 18px;border-radius:999px;background:#4a3d18;border:1px solid #806c2d;color:#ffe9a2;font-size:20px;font-weight:900}
.nextBlock{margin-top:4px;width:100%;display:flex;flex-direction:column;align-items:center}
.nextText{font-size:clamp(92px,25vw,190px);font-weight:900;color:#dce5f3;line-height:.9;margin-top:4px;max-width:96vw;word-break:keep-all;letter-spacing:-4px}
.songTransition{font-size:18px;color:#8ea2bf;margin-top:8px;font-weight:850;max-width:94vw;word-break:keep-all}
.runBottom{position:absolute;bottom:0;left:0;right:0;padding:0 14px calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:10px;z-index:5}
.runBtn{min-height:44px;padding:10px 13px;border-radius:13px;background:rgba(25,37,60,.95);border:1px solid #35445f;color:#dce5f3;font-weight:850}
.hint{text-align:center;color:#60718b;font-size:11px;line-height:1.45}
.flash{animation:flash .22s ease}
@keyframes flash{0%{transform:scale(.97);opacity:.65}100%{transform:scale(1);opacity:1}}
.finishTitle{font-size:48px;font-weight:950;letter-spacing:-2px}
.finishSub{color:#9babc2;margin-top:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:300;background:#172033;color:white;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:800;box-shadow:0 8px 26px rgba(0,0,0,.22)}

.current.type-a{color:#67a5ff}
.current.type-b{color:#7fd7a0}
.current.type-c{color:#c59cff}
.current.type-chorus{color:#4ee29a;text-shadow:0 0 24px rgba(78,226,154,.10)}
.current.type-interlude{color:#aab5c7}
.current.type-cue{color:#ffd45c;text-shadow:0 0 24px rgba(255,212,92,.12)}
.current.type-bridge{color:#c79bff}
.current.type-other{color:#ffffff}

@media(max-width:500px){
  .screen{padding-left:13px;padding-right:13px}.logo{font-size:26px}.current{letter-spacing:-2px}
}

@media(max-width:430px){
  .current{font-size:clamp(170px,48vw,245px);min-height:31vh;letter-spacing:-6px}
  .nextText{font-size:clamp(82px,23vw,128px);letter-spacing:-3px}
  .runSong{font-size:26px}
}

</style>
</head>
<body>

<section id="home" class="screen">
  <div class="top">
    <div class="logo">Praise Flow<small>찬양 인도 진행 도우미 · Beta 1</small></div>
    <button class="btn primary" onclick="newSet()">＋ 새 콘티</button>
  </div>
  <div id="setList"></div>
</section>

<section id="editor" class="screen hidden">
  <div class="top">
    <button class="btn" onclick="goHome()">← 목록</button>
    <b>콘티 편집</b>
    <button class="btn danger" onclick="deleteSet()">삭제</button>
  </div>
  <div class="label">콘티명</div>
  <input id="setTitle" class="input" oninput="updateTitle()" placeholder="예: 8/1 기도회 찬양">
  <div class="tip">진행 순서의 각 항목에서 <b>‹ / ›</b>를 눌러 위치를 바꾸고, <b>×</b>로 삭제할 수 있습니다. Key Up·멘트는 Cue로 표시됩니다.</div>
  <div id="songEditor"></div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="addSong()">＋ 곡 추가</button>
  <div class="bottomBar">
    <div class="bottomInner">
      <button class="btn" onclick="duplicateSet()">복제</button>
      <button class="btn primary" onclick="startRun()">▶ 찬양 시작</button>
    </div>
  </div>
</section>

<section id="run" class="hidden">
  <div class="runTop">
    <div class="runTopLine">
      <div id="runSet" class="runSet"></div>
      <div id="runCount" class="runCount"></div>
    </div>
    <div class="progress"><div id="runProgress"></div></div>
  </div>
  <div class="stage" id="stage">
    <div id="runSong" class="runSong"></div>
    <div id="current" class="current"></div>
    <div id="note" class="note"></div>
    <div class="nextBlock">
      <div class="kicker">다음</div>
      <div id="next" class="nextText"></div>
      <div id="transition" class="songTransition"></div>
    </div>
  </div>
  <div class="runBottom">
    <button class="runBtn" onclick="event.stopPropagation();prev()">← 이전</button>
    <div class="hint">한 번 터치: 다음<br>두 번 터치: 실행 취소</div>
    <button class="runBtn" onclick="event.stopPropagation();exitRun()">종료</button>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script>
const KEY='praise-flow-beta1-final';
const sample=[{
 id:'sample',title:'8/1 기도회 찬양',
 songs:[
  {name:'보혈을 지나',steps:[{t:'A'},{t:'A'},{t:'후렴'},{t:'A'},{t:'후렴'},{t:'후렴'},{t:'후렴'},{t:'내 영을~ ×2'}]},
  {name:'신실하게 진실하게',steps:[{t:'A'},{t:'후렴'},{t:'A'},{t:'후렴2',cue:true,note:'Key Up'},{t:'후렴1'},{t:'후렴2'},{t:'후렴1',cue:true,note:'Hallelujah 말하면서'}]},
  {name:'나의 피난처 예수',steps:[{t:'A'},{t:'B'},{t:'후렴'},{t:'짧은 간주',cue:true,note:'짧은 간주'},{t:'A'},{t:'B'},{t:'후렴'},{t:'후렴',cue:true,note:'Key Up'},{t:'간주2'},{t:'후렴',cue:true,note:'멈춤 후 Key Up'},{t:'후렴+',cue:true,note:'목소리 높여'}]},
  {name:'아바아버지',steps:[{t:'A'},{t:'A'},{t:'후렴'},{t:'A'},{t:'후렴'},{t:'후렴',cue:true,note:'Key Up'},{t:'후렴'},{t:'후렴'},{t:'내 영을 새롭게~'}]},
  {name:'충만 (결단)',steps:[{t:'A'},{t:'B'},{t:'후렴1'},{t:'간주'},{t:'C'},{t:'후렴2'},{t:'후렴♪',cue:true,note:'Key Up'},{t:'영원한 왕~'}]}
 ]
}];

let sets=load(), currentId=null, run={flat:[],i:0,wake:null};
let tapTimer=null,lastTap=0;
const $=id=>document.getElementById(id);
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()+'')}
function deep(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:deep(sample)}catch(e){return deep(sample)}}
function save(){localStorage.setItem(KEY,JSON.stringify(sets))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(id){['home','editor','run'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function cur(){return sets.find(s=>s.id===currentId)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1200)}

function renderHome(){
 $('setList').innerHTML=sets.map(s=>{
   const n=s.songs.reduce((a,b)=>a+b.steps.length,0);
   return `<div class="card setCard" onclick="openSet('${s.id}')">
    <div><h3>${esc(s.title||'제목 없는 콘티')}</h3><div class="meta">${s.songs.length}곡 · ${n}단계</div></div>
    <button class="btn dark">열기 →</button>
   </div>`
 }).join('') || '<div class="card">저장된 콘티가 없습니다.</div>';
}
function goHome(){save();renderHome();show('home')}
function newSet(){
 const s={id:uid(),title:'새 찬양 콘티',songs:[{name:'곡 제목',steps:[{t:'A'},{t:'후렴'}]}]};
 sets.unshift(s);save();openSet(s.id)
}
function openSet(id){currentId=id;renderEditor();show('editor')}
function updateTitle(){const s=cur();if(s){s.title=$('setTitle').value;save()}}
function duplicateSet(){let s=deep(cur());s.id=uid();s.title=(s.title||'콘티')+' 복사본';sets.unshift(s);save();currentId=s.id;renderEditor();toast('복제했습니다')}
function deleteSet(){if(!confirm('이 콘티를 삭제할까요?'))return;sets=sets.filter(s=>s.id!==currentId);save();goHome()}

function renderEditor(){
 const s=cur(); if(!s)return goHome();
 $('setTitle').value=s.title||'';
 $('songEditor').innerHTML=s.songs.map((song,si)=>`
 <div class="song">
   <div class="songHead">
     <input class="input" value="${esc(song.name)}" onchange="renameSong(${si},this.value)" aria-label="곡명">
     <div class="songTools">
       <button class="iconBtn" onclick="moveSong(${si},-1)">↑</button>
       <button class="iconBtn" onclick="moveSong(${si},1)">↓</button>
       <button class="iconBtn" onclick="removeSong(${si})">×</button>
     </div>
   </div>
   <div class="label">빠른 추가</div>
   <div class="quick">
    ${['A','B','C','후렴','후렴1','후렴2','간주','Bridge'].map(x=>`<button onclick="addStep(${si},'${x}')">${x}</button>`).join('')}
    <button class="cue" onclick="addCue(${si},'Key Up')">⚠ Key Up</button>
    <button class="cue" onclick="addCue(${si},'멘트')">🎤 멘트</button>
   </div>
   <div class="label">진행 순서</div>
   <div class="steps">
    ${song.steps.map((st,ti)=>`
      <span class="step ${st.cue?'cue':''}">
       ${esc(st.t)}${st.note?` · ${esc(st.note)}`:''}
       <button class="mini" onclick="moveStep(${si},${ti},-1)">‹</button>
       <button class="mini" onclick="moveStep(${si},${ti},1)">›</button>
       <button class="mini" onclick="removeStep(${si},${ti})">×</button>
      </span>`).join('')}
   </div>
   <div class="customRow">
    <input id="custom-${si}" class="input" placeholder="직접 입력: 내 영을~ ×2">
    <button class="btn" onclick="addCustom(${si})">추가</button>
   </div>
 </div>`).join('');
}
function renameSong(si,v){cur().songs[si].name=v;save()}
function addSong(){cur().songs.push({name:'새 곡',steps:[]});save();renderEditor()}
function removeSong(si){cur().songs.splice(si,1);save();renderEditor()}
function moveSong(si,d){const a=cur().songs,j=si+d;if(j<0||j>=a.length)return;[a[si],a[j]]=[a[j],a[si]];save();renderEditor()}
function addStep(si,t){cur().songs[si].steps.push({t});save();renderEditor()}
function addCue(si,note){cur().songs[si].steps.push({t:'Cue',cue:true,note});save();renderEditor()}
function addCustom(si){const e=$(`custom-${si}`),v=e.value.trim();if(!v)return;cur().songs[si].steps.push({t:v});save();renderEditor()}
function removeStep(si,ti){cur().songs[si].steps.splice(ti,1);save();renderEditor()}
function moveStep(si,ti,d){const a=cur().songs[si].steps,j=ti+d;if(j<0||j>=a.length)return;[a[ti],a[j]]=[a[j],a[ti]];save();renderEditor()}


function currentTypeClass(step){
 const raw=(step?.t||'').trim();
 const note=(step?.note||'').trim();
 const s=(raw+' '+note).toLowerCase();
 if(step?.cue || /key\s*up|멘트|cue/.test(s)) return 'type-cue';
 if(/^a($|\s|\d)/i.test(raw)) return 'type-a';
 if(/^b($|\s|\d)/i.test(raw)) return 'type-b';
 if(/^c($|\s|\d)/i.test(raw)) return 'type-c';
 if(/후렴|chorus/.test(s)) return 'type-chorus';
 if(/간주|interlude|intro/.test(s)) return 'type-interlude';
 if(/bridge|브릿지/.test(s)) return 'type-bridge';
 return 'type-other';
}

function flatten(s){const f=[];s.songs.forEach((song,si)=>song.steps.forEach((st,ti)=>f.push({song:song.name,si,ti,...st})));return f}
async function wake(){try{if('wakeLock'in navigator)run.wake=await navigator.wakeLock.request('screen')}catch(e){}}
async function unwake(){try{await run.wake?.release()}catch(e){}run.wake=null}
function startRun(){
 updateTitle();
 run.flat=flatten(cur());run.i=0;
 if(!run.flat.length){alert('진행 순서를 먼저 추가해주세요.');return}
 $('runSet').textContent=cur().title;
 show('run');renderRun();wake()
}
function renderRun(){
 const f=run.flat,i=run.i;
 if(i>=f.length){
  $('runSong').textContent='';$('current').className='current type-other';$('current').innerHTML='<div class="finishTitle">전체 완료</div><div class="finishSub">찬양 순서가 끝났습니다.</div>';
  $('note').innerHTML='';$('next').textContent='—';$('transition').textContent='';
  $('runCount').textContent=`${f.length} / ${f.length}`;$('runProgress').style.width='100%';return;
 }
 const c=f[i],n=f[i+1];
 $('runSong').textContent=c.song;
 $('current').textContent=c.t;
 $('current').className='current '+currentTypeClass(c);
 $('current').classList.remove('flash');void $('current').offsetWidth;$('current').classList.add('flash');
 $('note').innerHTML=c.note?`<div class="notePill">${esc(c.note)}</div>`:'';
 $('runCount').textContent=`${i+1} / ${f.length}`;
 $('runProgress').style.width=`${((i+1)/f.length)*100}%`;
 if(!n){$('next').textContent='전체 완료';$('transition').textContent=''}
 else if(n.song!==c.song){$('next').textContent=n.song;$('transition').textContent=`다음 곡 · 첫 순서 ${n.t}`}
 else{$('next').textContent=n.t;$('transition').textContent=n.note?`⚠ ${n.note}`:''}
}
function next(){
 const n=run.flat[run.i+1];
 if(run.i<run.flat.length){
   run.i++;
   if(n && (n.cue||n.note)) navigator.vibrate?.([30,40,30]); else navigator.vibrate?.(15);
   renderRun()
 }
}
function prev(){if(run.i>0){run.i--;navigator.vibrate?.([15,30,15]);renderRun()}}
function exitRun(){unwake();show('editor')}
$('run').addEventListener('pointerup',e=>{
 if(e.target.closest('button'))return;
 const now=Date.now();
 if(now-lastTap<290){clearTimeout(tapTimer);tapTimer=null;lastTap=0;prev()}
 else{lastTap=now;tapTimer=setTimeout(()=>{next();lastTap=0;tapTimer=null},300)}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('run').classList.contains('hidden'))wake()});
renderHome();
</script>
</body>
</html>
